<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Research Assistant</title>
  
  <!-- Modern Clean Design Stylesheets -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>

  <!-- ============================================================ -->
  <!-- 1. AUTHENTICATION VIEW                                      -->
  <!-- ============================================================ -->
  <div id="auth-view">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Intelligence Analytics</span>
        <h1 class="auth-title">Security Research Assistant</h1>
        <p class="auth-subtitle">Ulusal güvenlik belgelerinde tehdit analizi ve kaynak doğrulama</p>
      </div>

      <div id="login-alert" class="alert alert-danger hidden" role="alert"></div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="login-username" class="form-label" data-i18n="username">Kullanıcı Adı</label>
          <input
            type="text"
            id="login-username"
            name="username"
            class="form-control"
            required
            autocomplete="username"
            placeholder="admin"
          />
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label" data-i18n="password">Şifre</label>
          <input
            type="password"
            id="login-password"
            name="password"
            class="form-control"
            required
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary auth-submit-btn">
          Giriş Yap / Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- 2. MAIN APPLICATION DASHBOARD VIEW (Shown after auth)        -->
  <!-- ============================================================ -->
  <div id="app-view" class="hidden">
    
    <!-- Sidebar Controls -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>SRA Dashboard</span>
        </div>
      </div>

      <!-- Language Switch -->
      <div class="sidebar-section">
        <label class="sidebar-section-title" id="language-label" data-i18n="language_label">Dil / Language</label>
        <div class="lang-switch-container" role="radiogroup" aria-labelledby="language-label">
          <div class="lang-switch-slider" id="lang-slider"></div>
          <button type="button" class="lang-switch-btn active" data-lang="tr" id="lang-btn-tr" role="radio" aria-checked="true">
            <span class="lang-flag">🇹🇷</span> <span>Türkçe</span>
          </button>
          <button type="button" class="lang-switch-btn" data-lang="en" id="lang-btn-en" role="radio" aria-checked="false">
            <span class="lang-flag">🇬🇧</span> <span>English</span>
          </button>
        </div>
        <!-- Hidden select preserved for test compatibility & form fallback -->
        <select id="language-select" class="visually-hidden" aria-hidden="true" tabindex="-1">
          <option value="tr">Türkçe (TR)</option>
          <option value="en">English (EN)</option>
        </select>
      </div>

      <!-- Document Select -->
      <div class="sidebar-section">
        <label class="sidebar-section-title" id="document-label" data-i18n="document_label">Belge</label>
        <div class="custom-dropdown" id="document-dropdown">
          <button type="button" class="custom-dropdown-trigger" id="document-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-dropdown-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
            </span>
            <span class="custom-dropdown-label" id="document-dropdown-label">Seçiniz...</span>
            <span class="custom-dropdown-arrow" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
          <ul class="custom-dropdown-menu" id="document-dropdown-menu" role="listbox" aria-labelledby="document-label">
            <!-- Populated dynamically via JS -->
          </ul>
          <!-- Native select kept visually-hidden for test compatibility & form fallback -->
          <select id="document-select" class="visually-hidden" aria-hidden="true" tabindex="-1">
            <!-- Populated dynamically via API -->
          </select>
        </div>
      </div>

      <!-- Category Select -->
      <div class="sidebar-section">
        <label class="sidebar-section-title" id="category-label" data-i18n="category_label">Kategori</label>
        <div class="custom-dropdown" id="category-dropdown">
          <button type="button" class="custom-dropdown-trigger" id="category-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-dropdown-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
              </svg>
            </span>
            <span class="custom-dropdown-label" id="category-dropdown-label">Russia</span>
            <span class="custom-dropdown-arrow" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
          <ul class="custom-dropdown-menu" id="category-dropdown-menu" role="listbox" aria-labelledby="category-label">
            <!-- Populated dynamically via JS -->
          </ul>
          <!-- Native select kept visually-hidden for test compatibility & form fallback -->
          <select id="category-select" class="visually-hidden" aria-hidden="true" tabindex="-1">
            <option value="Russia">Russia</option>
            <option value="China">China</option>
            <option value="Cyber">Cyber</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Migration">Migration</option>
          </select>
        </div>
      </div>

      <!-- Filters -->
      <div class="sidebar-section">
        <label class="sidebar-section-title" data-i18n="filters_label">Filtreler</label>
        <div class="sidebar-checkbox-group">
          <label class="checkbox-label" for="filter-review-only">
            <input type="checkbox" id="filter-review-only" />
            <span class="custom-checkbox-box" aria-hidden="true">
              <svg width="10" height="8" viewBox="0 0 10 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 3.5 6.5 9 1"></polyline>
              </svg>
            </span>
            <span data-i18n="show_review_required">Yalnızca inceleme gerektirenler</span>
          </label>
          <label class="checkbox-label" for="filter-include-baseline">
            <input type="checkbox" id="filter-include-baseline" />
            <span class="custom-checkbox-box" aria-hidden="true">
              <svg width="10" height="8" viewBox="0 0 10 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 3.5 6.5 9 1"></polyline>
              </svg>
            </span>
            <span data-i18n="include_review_only">İnceleme amaçlı eşleşmeleri dahil et</span>
          </label>
        </div>
      </div>

      <!-- Sidebar Footer / Auth state -->
      <div class="sidebar-footer">
        <div class="user-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="7" r="4"/>
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          </svg>
          <span data-i18n="logged_in_as">Giriş yapan:</span>
          <strong id="current-user-name" style="color: #FFFFFF;"></strong>
        </div>
        <button id="logout-btn" class="btn btn-secondary btn-sm sidebar-logout-btn" data-i18n="sign_out">
          Çıkış Yap
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Ephemeral Alert Banner (e.g. rate limit or network warning) -->
      <div id="board-alert" class="alert hidden" role="alert"></div>

      <!-- 1. Document Overview Cards -->
      <section id="document-overview-container" aria-label="Document Overview"></section>

      <!-- 2. Category Metrics Banner -->
      <section id="category-metrics-container" aria-label="Category Metrics"></section>

      <!-- 3. Category Frequency Bar Chart -->
      <section id="category-chart-container" aria-label="Category Frequency Chart"></section>

      <!-- 4. Human Verification Summary Cards -->
      <section id="human-verification-container" aria-label="Human Verification Summary"></section>

      <!-- 5. Source Passages Review Board (3 Columns) -->
      <section id="source-passages-container" aria-label="Source Passages Review Board"></section>

      <!-- 6. Cross-Document Comparison Bar Chart -->
      <section id="cross-doc-chart-container" aria-label="Cross-Document Comparison Chart"></section>
    </main>

  </div>

  <!-- Assets & Modules -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
